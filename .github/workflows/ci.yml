name: CI (local-first)

# LOCAL-FIRST: все шаги работают офлайн — установка зависимостей из
# pnpm-lock.yaml без постинсталл-сборки нативных модулей, тесты только
# юнит/интеграционные (внешние сети не трогаем).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4            # версия берётся из packageManager в package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile, no native post-install)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit/integration tests
        run: pnpm test
      - name: Local-mode guard smoke
        run: pnpm --filter @opencreator/daemon test -- test/unit/local-guard.test.ts test/unit/api-auth.test.ts

  python-local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install (pinned via local-stack/pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install -e ./local-stack[dev] || pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest tests/local -q
      - name: Static typing (best-effort)
        run: python -m mypy local-stack --ignore-missing-imports || true

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dependency audit
        run: pnpm audit --audit-level=high || true
