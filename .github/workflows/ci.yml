name: CI (local-first)

# LOCAL-FIRST: юнит/интеграционные тесты не обращаются к внешним сетям.
# Установка зависимостей pnpm и Python может обращаться к реестрам;
# postinstall-скрипты pnpm отключены через --ignore-scripts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0; pnpm version from packageManager in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile, no native post-install)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit/integration tests
        run: pnpm test
      - name: Local-mode guard smoke
        run: pnpm --filter @opencreator/daemon test -- test/unit/local-guard.test.ts test/unit/api-auth.test.ts

  python-local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install (pinned via local-stack/pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install -e ./local-stack[dev] || pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest tests/local -q
      - name: Static typing (best-effort)
        run: python -m mypy local-stack --ignore-missing-imports || true

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Dependency audit
        run: pnpm audit --audit-level=high || true
