name: Sync upstream OpenCreator

# LOCAL-FIRST + безопасный flow: синхронизация с апстримом больше НЕ
# перезаписывает main через rm -rf. Вместо этого создаётся ветка и Pull
# Request — изменения попадают в main только после ревью и зелёного CI.

on:
  schedule:
    - cron: '0 11 * * *'  # daily ~7am ET
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out our repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Build upstream snapshot on a sync branch
        run: |
          set -euo pipefail
          git config user.name "opencreator-sync-bot"
          git config user.email "opencreator-sync-bot@users.noreply.github.com"

          BRANCH="sync/upstream-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          # Сохраняем наши локализационные/автомационные файлы
          KEEP=(
            .github/workflows/ci.yml
            .github/workflows/sync-upstream.yml
            scripts/inject_apify_ad.py
            ATTRIBUTION.md
            README_LOCAL.md
            local-stack
            tests/local
            apps/daemon/src/api/auth.ts
            apps/daemon/test/unit/api-auth.test.ts
          )
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          for f in "${KEEP[@]}"; do
            if [ -e "$f" ]; then mkdir -p "/tmp/keep/$(dirname "$f")"; cp -a "$f" "/tmp/keep/$f"; fi
          done

          # Свежий снапшот апстрима (клон — это сетевая операция установки,
          # допустимая вне рантайма приложения)
          rm -rf /tmp/upstream
          git clone --depth 1 https://github.com/krillinai/OpenCreator.git /tmp/upstream

          # Заменяем рабочее дерево снапшотом апстрима, .git не трогаем
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          tar -C /tmp/upstream --exclude=.git -cf - . | tar -xf - .

          # Возвращаем наше
          for f in "${KEEP[@]}"; do
            if [ -e "/tmp/keep/$f" ]; then mkdir -p "$(dirname "$f")"; cp -a "/tmp/keep/$f" "$f"; fi
          done
          # Чужие CI-workflow апстрима здесь не запускаются
          find .github/workflows -type f ! -name 'sync-upstream.yml' ! -name 'ci.yml' -delete 2>/dev/null || true

          python3 scripts/inject_apify_ad.py

          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync upstream OpenCreator ($(date -u +%Y-%m-%d))"
            git push origin "$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi
        id: sync

      - name: Open Pull Request (never auto-push to main)
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Sync upstream OpenCreator" \
            --body "Автоматический снапшот апстрима. См. diff; мержить только после зелёного CI (защита ветки main). Запуски workflow pull_request требуют одобрения: одобрите их для запуска CI до мержа." \
            --head "${{ steps.sync.outputs.branch }}" \
            --base main --fill-headless 2>/dev/null || \
          gh pr create \
            --title "Sync upstream OpenCreator" \
            --body "Автоматический снапшот апстрима. Мержить только после зелёного CI. Запуски workflow pull_request требуют одобрения: одобрите их для запуска CI до мержа." \
            --head "${{ steps.sync.outputs.branch }}" --base main
